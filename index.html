<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Repository</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --accent: #22d3ee; --accent-dark: #0891b2;
    --text: #e2e8f0; --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at top, #1e293b, #0f172a);
    font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); padding: 20px;
  }
  .card {
    background: var(--card); border-radius: 16px; padding: 44px 36px; width: 100%; max-width: 380px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.06);
    text-align: center;
  }
  .logo {
    width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    display: flex; align-items: center; justify-content: center; font-size: 1.8rem;
  }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  p.subtitle { color: var(--muted); margin: 0 0 32px; font-size: 0.9rem; }
  .btn {
    display: block; width: 100%; padding: 14px; border-radius: 8px; font-weight: 600;
    font-size: 0.95rem; text-decoration: none; margin-bottom: 12px; transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.9; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #0f172a; }
  .btn-secondary { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: var(--text); }
  .footer-note { color: var(--muted); font-size: 0.75rem; margin-top: 20px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🎮</div>
    <h1>Game Repository</h1>
    <p class="subtitle">Access sa libraries ng games at apps</p>

    <a href="login.html" class="btn btn-primary">Mag-login</a>
    <a href="register.html" class="btn btn-secondary">Mag-request ng Account</a>

    <p class="footer-note">Kailangan ng sales invoice number para makapag-request ng bagong account.</p>
  </div>
</body>
</html>
